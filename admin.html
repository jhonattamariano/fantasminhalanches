<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0b">
<title>Painel Fantasminha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Painel de gestão mobile-first: lista por categoria, folha inferior para editar. Mesmo visual do cardápio. */
:root{
  --bg:#0f0d0b; --surface:#1b1814; --surface2:#26221c; --line:#3a332a;
  --fg:#f6efe4; --muted:#b3a794; --accent:#ffa21a; --accent-ink:#1a1206;
  --ok:#5fd38a; --bad:#ff8f7a;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
input,select,textarea{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.f{display:grid;gap:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.danger{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600}
.err{color:var(--bad);margin:0;font-size:14px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.login form{width:100%;max-width:360px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{font-size:40px;line-height:.95}
.login h1 span{color:var(--accent)}
.login p{margin:0;color:var(--muted);font-size:14px}

/* topo */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.top h1{font-size:28px;flex:1;min-width:0}
.top h1 span{color:var(--accent)}
.top a{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;width:100%;overflow-x:auto}
.tab{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding-block:8px 16px}
.cat{padding-top:22px;display:grid;gap:10px}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cat-h h2{font-size:28px;color:var(--accent)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.row.off{opacity:.55}
.row .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.1}
.row .info{min-width:0;background:none;border:0;text-align:left;padding:0;display:grid;gap:2px}
.row .info b{font-weight:700;overflow-wrap:anywhere}
.row .info b small{color:var(--muted);margin-right:6px}
.row .info span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.swl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}

/* listas simples (acréscimos, entrega) */
.list{display:grid;gap:8px;padding-top:18px}
.lrow{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.lrow.nofee{grid-template-columns:1fr 110px auto}
.lrow .x{background:none;border:0;color:var(--muted);font-size:22px;width:32px;height:32px}
@media (max-width:440px){.lrow{grid-template-columns:1fr 92px auto auto}}

/* folha */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh-head h3{font-size:30px}
.close{background:var(--surface2);border:0;border-radius:999px;width:36px;height:36px;font-size:20px}
.photo{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.photo .pv{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.photo .acts{display:grid;gap:8px;justify-items:start}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.g2{display:grid;grid-template-columns:110px 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot .btn{flex:1}
.hint{color:var(--muted);font-size:13px;margin:0}
.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--bad);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{background:var(--bad)}
#newBanner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;width:min(94vw,520px);background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 16px;font-size:16px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.55);display:grid;gap:2px}
#newBanner span{opacity:.8}#newBanner small{font-weight:600;opacity:.75}
#newBanner.ring{animation:ring .6s ease-in-out 5}
@keyframes ring{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-1.5deg)}75%{transform:translateX(-50%) rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){#newBanner.ring{animation:none}}
.empty{color:var(--muted);padding-block:30px;text-align:center}
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#1a0703;font-size:12px;margin-left:4px;padding:0 5px}
.olist{display:grid;gap:10px;padding-top:6px}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;border-left:5px solid var(--line)}
.ord.st-novo{border-left-color:var(--accent);box-shadow:0 0 0 1px rgba(255,162,26,.35)}
.ord.st-saiu,.ord.st-concluido,.ord.st-cancelado{opacity:.6}
.ord header{display:flex;align-items:center;gap:10px}
.ord header b{font-family:var(--display);font-size:28px;font-weight:400;letter-spacing:.02em}
.pill{border:1px solid var(--c);color:var(--c);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.when{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.who a{color:var(--accent)}
.addr span{color:var(--muted)}
.its{list-style:none;margin:0;padding:10px 0;border-block:1px dashed var(--line);display:grid;gap:8px}
.iln{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.qb{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;border-radius:8px;padding:2px 8px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.iln b{font-size:17px}.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px;margin-left:4px;color:var(--fg)}
.inum{color:var(--muted);margin-left:6px}
.its li+li{padding-top:8px;border-top:1px solid var(--line)}
.its .sub{color:var(--muted);font-size:14px}
.its .obs{display:inline-block;margin-top:3px;background:var(--fg);color:var(--bg);font-weight:700;padding:1px 6px;border-radius:4px;font-size:14px}
.foot2{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.foot2 b{font-size:20px}
.resend{color:var(--accent);font-size:14px}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff8f7a;vertical-align:middle;margin-left:4px;box-shadow:0 0 0 3px rgba(255,143,122,.2)}
.live.on{background:#5fd38a;box-shadow:0 0 0 3px rgba(95,211,138,.2)}
.ofil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-weight:700;font-size:15px;display:grid;gap:2px;justify-items:center;line-height:1.15}
.chip span{color:var(--muted);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin:0}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip.on span{color:var(--accent-ink)}
.chip.hot:not(.on){border-color:var(--accent)}.chip.hot:not(.on) span{color:var(--accent)}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.hrs{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:1fr auto 96px auto 96px;gap:8px;align-items:center}
.hr.off b{color:var(--muted)}.hr input[type=time]{padding:8px}.hr input:disabled{opacity:.35}.hr .as{color:var(--muted);font-size:13px}
@media (max-width:420px){.hr{grid-template-columns:1fr auto;row-gap:4px}.hr input[type=time]{grid-column:span 1}.hr .as{display:none}}
.mnav{display:flex;align-items:center;gap:8px}.mnav b{min-width:130px;text-align:center}.mnav .ghost{padding:6px 12px}.mnav .ghost:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ph h3{font-size:24px}
.seg.sm{grid-template-columns:auto auto}.seg.sm button{padding:6px 10px;font-size:13px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center}
.pos{color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rk{display:grid;gap:4px;min-width:0}.rl{display:flex;justify-content:space-between;gap:10px}.rl b{min-width:0;overflow-wrap:anywhere}
.rl span{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}.rl em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.days{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;height:140px;align-items:end;border-bottom:1px solid var(--line)}
.day{height:100%;display:flex;align-items:flex-end;cursor:pointer;outline-offset:1px}.day i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:3px 3px 0 0}
.day.best i,.day:hover i,.day:focus i{opacity:1}
.daxis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tip{position:absolute;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap}
.payr{display:grid;grid-template-columns:80px 1fr 44px 90px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}.payr b{text-align:right}.payr em{font-style:normal;color:var(--muted);text-align:right;font-size:14px}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 .btn{flex:1;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center}.acts2 .btn small{font-weight:600;font-size:12px;opacity:.75}

  const n=D.orders.filter(x=>x.status==="novo").length;b.innerHTML=`🔔 <b>Novo pedido #${nº(o)}</b> · ${esc(o.customer_name)} · ${BRL(o.total)}${n>1?` <span>(${n} novos)</span>`:""}<small>Toque para ver</small>`;

/* ---------- login ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#login").hidden=false;$("#app").hidden=true;return}
  const {data:ok,error}=await sb.rpc("is_admin");
  if(error||!ok){await sb.auth.signOut();showLoginErr(error?"Não foi possível verificar o acesso.":"Este e-mail não tem acesso ao painel.");$("#login").hidden=false;$("#app").hidden=true;return}
  $("#login").hidden=true;$("#app").hidden=false;load();
}
function showLoginErr(m){const e=$("#loginErr");e.textContent=m;e.hidden=false}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("#loginErr").hidden=true;const b=$("#loginBtn");b.disabled=true;b.textContent="Entrando…";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  b.disabled=false;b.textContent="Entrar";
  if(error)return showLoginErr(error.message.includes("Invalid")?"E-mail ou senha incorretos.":error.message);
  boot();
});
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---------- dados ---------- */
async function load(){
  $("#main").innerHTML='<p class="empty">Carregando…</p>';
  const [c,i,a,f]=await Promise.all([sb.from("categories").select("*").order("sort"),sb.from("items").select("*").order("sort"),sb.from("addons").select("*").order("sort"),sb.from("delivery_fees").select("*").order("sort")]);
  const err=c.error||i.error||a.error||f.error;
  if(err){$("#main").innerHTML='<p class="empty">Não foi possível carregar. Atualize a página.</p>';return fail(err)}
  D={...D,cats:c.data,items:i.data,addons:a.data,fees:f.data};
  const st=await sb.from("settings").select("*");(st.data||[]).forEach(x=>D.settings[x.key]=x.value);
  D.priv={};const pv=await sb.from("private_settings").select("*");(pv.data||[]).forEach(x=>D.priv[x.key]=x.value);
  await loadOrders();listenOrders();render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.tab!=="vendas")salesOk=false;tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
function render(){({vendas:renderSales,pedidos:renderOrders,itens:renderItems,addons:()=>renderList("addons"),fees:()=>renderList("fees"),loja:renderLoja})[tab]();if(tab==="pedidos"){unseen=0;badge()}}

/* ---------- pedidos ---------- */
const ST={novo:["Novo","#ffa21a"],preparo:["Em preparo","#6cb4ff"],saiu:["Finalizado","#5fd38a"],concluido:["Concluído","#5fd38a"],cancelado:["Cancelado","#ff8f7a"]};
const NEXT={novo:["preparo","Começar preparo"],preparo:["saiu","Finalizar"]};
const nº=o=>String(o.day_no??o.id).padStart(2,"0");
const SZ={P:"Pequeno",M:"Médio",G:"Grande"};
function custMsg(o,to){
  const n=String(o.customer_name).trim().split(" ")[0], h=new Date().getHours();
  const oi=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  const head={
    preparo:`${oi}, ${n}! 👻\nObrigado por pedir com a gente na *Fantasminha Lanches*! 🧡\n\nSeu pedido *#${nº(o)}* foi *confirmado* e já está sendo preparado. 🍔🔥`,
    saiu:o.mode==="entrega"
      ?`${oi}, ${n}! 👻🛵\nBoas notícias: seu pedido *#${nº(o)}* acabou de *sair para entrega*!\nNosso entregador já está a caminho e o seu lanche vai chegar quentinho. 🔥\n\n✅ Deixe o pagamento separado pra agilizar a entrega\n✅ Fique de olho no celular, se precisarmos a gente te chama por aqui`
      :`${oi}, ${n}! 👻🍔\nSeu pedido *#${nº(o)}* está *prontinho* e esperando por você no balcão!\nÉ só chegar e informar o número *#${nº(o)}*. 😉`,
    concluido:`${oi}, ${n}! 👻🧡\nSeu pedido *#${nº(o)}* foi *${o.mode==="entrega"?"entregue":"retirado"}* com sucesso.\n\nMuito obrigado por escolher a *Fantasminha Lanches*! Esperamos que tenha sido assombrosamente gostoso. 😋\n\n⭐ Se puder, conta pra gente o que achou. Sua opinião ajuda demais!`,
    cancelado:`${oi}, ${n}. 👻\nInfelizmente seu pedido *#${nº(o)}* foi *cancelado*.\nSe tiver qualquer dúvida, é só responder esta mensagem.`}[to];
  if(!head)return "";
  const L=[head,"",to==="concluido"?"🧾 *Resumo do seu pedido:*":"🧾 *Seu pedido:*"];
  o.items.forEach(it=>{L.push(`• ${it.qty}x ${it.name}${it.size?` (${SZ[it.size]||it.size})`:""}${it.option?` · ${it.option}`:""} · ${BRL(it.total)}`);
    it.addons.forEach(a=>L.push(`   + ${a.qty}x ${a.name}`));if(it.obs)L.push(`   _Obs: ${it.obs}_`)});
  L.push("");
  if(+o.delivery_fee)L.push(`Subtotal: ${BRL(o.subtotal)}`,`Entrega: ${BRL(o.delivery_fee)}`);
  L.push(`💰 *Total: ${BRL(o.total)}*`,`💳 Pagamento: ${o.payment}${o.change_for?` (troco para R$ ${o.change_for})`:""}`);
  if(o.payment==="Pix"&&D.settings.pix_key&&(to==="preparo"||to==="saiu"))L.push(`💠 Pix (celular): ${D.settings.pix_key}${D.settings.pix_name?` · ${D.settings.pix_name}`:""}`,"_Se ainda não pagou, envie o comprovante por aqui._");
  L.push(o.mode==="entrega"?`📍 Entrega: ${o.street}, ${o.number} · ${o.district}${o.complement?` (${o.complement})`:""}`:"📍 Retirada no balcão");
  L.push("",({preparo:"Qualquer dúvida, é só chamar por aqui! 👻🍔",
    saiu:o.mode==="entrega"?"Muito obrigado por pedir com a gente! 🧡\nBom apetite! 👻🍔":"Muito obrigado por pedir com a gente! 🧡\nTe esperamos! 👻🍔",
    concluido:`Bateu a fome de novo? Peça pelo nosso cardápio:\n👉 ${location.origin}\n\nAté a próxima! 👻🍔`,
    cancelado:"Pedimos desculpas pelo transtorno. 👻"})[to]);
  return L.join("\n");
}
function openWa(url){let w=null;try{w=window.open(url,"_blank")}catch(e){}if(!w)location.href=url}
const waCust=(o,to)=>`https://api.whatsapp.com/send?phone=55${String(o.phone).replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"")}&text=${encodeURIComponent(custMsg(o,to))}`;
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}
async function loadOrders(){const {data,error}=await sb.from("orders").select("*").gte("created_at",dayStart()).order("created_at",{ascending:false});if(error)return fail(error);D.orders=data}
let chan, polling;
// rede de segurança: confere a cada 30s e ao voltar pra tela, caso o tempo real tenha caído
async function syncOrders(){const {data,error}=await sb.from("orders").select("*").gte("created_at",dayStart()).order("created_at",{ascending:false});if(error||!data)return;
  const known=new Set(D.orders.map(o=>o.id)), fresh=data.filter(o=>!known.has(o.id)).reverse();
  data.forEach(n=>{const o=D.orders.find(x=>x.id===n.id);if(o)Object.assign(o,n)});
  fresh.forEach(o=>{D.orders.unshift(o);alertNew(o)});
  if(fresh.length||tab==="pedidos")D.orders.sort((a,b)=>b.id-a.id);
  if(tab==="pedidos")renderOrders()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
addEventListener("online",wake);addEventListener("focus",wake);addEventListener("pageshow",wake);
function onOrderChange(pl){
    if(pl.eventType==="INSERT"){if(D.orders.some(x=>x.id===pl.new.id))return;D.orders.unshift(pl.new);alertNew(pl.new)}
    else if(pl.eventType==="UPDATE"){const o=D.orders.find(x=>x.id===pl.new.id);if(o)Object.assign(o,pl.new)}
    if(tab==="pedidos")renderOrders()}
let reTimer;
function subscribe(){
  if(chan){try{sb.removeChannel(chan)}catch(e){}}
  chan=sb.channel("pedidos-"+Date.now()).on("postgres_changes",{event:"*",schema:"public",table:"orders"},onOrderChange)
    .subscribe(st=>{if(st==="SUBSCRIBED"){syncOrders();setLive(true)}
      if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){setLive(false);clearTimeout(reTimer);reTimer=setTimeout(subscribe,4000)}})}
function listenOrders(){if(chan)return;polling=setInterval(syncOrders,20000);subscribe()}
function setLive(on){const b=document.getElementById("liveDot");if(b){b.classList.toggle("on",on);b.title=on?"Conectado: pedidos chegam na hora":"Reconectando…"}}
// ao voltar pra tela / internet voltar: reconecta, confere pedidos e reativa o som
function wake(){if(!chan)return;if(actx&&actx.state!=="running")actx.resume();if(soundOn){keepAwake();startKeepAlive()}
  const st=chan.state;if(st!=="joined"&&st!=="joining")subscribe();syncOrders()}

let actx;
let wl=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
function releaseAwake(){try{wl&&wl.release()}catch(e){}wl=null}

let ringAt=0;
let ka=null;
function startKeepAlive(){try{actx=actx||new AudioContext();if(ka)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=30;g.gain.value=.0008;o.connect(g).connect(actx.destination);o.start();ka={o,g}}catch(e){}}
function stopKeepAlive(){try{ka&&ka.o.stop()}catch(e){}ka=null}
function beep(){if(!soundOn)return 0;try{actx=actx||new AudioContext();if(actx.state!=="running")actx.resume();const t0=Math.max(actx.currentTime+.05,ringAt);ringAt=t0+4.3;const delay=(t0-actx.currentTime)*1000;
  // campainha de ~4s: 3 rodadas de "ding-dong-ding"
  for(let r=0;r<3;r++){[[0,880],[.25,1175],[.5,1480],[.85,1175]].forEach(([d,f])=>{const at=t0+r*1.35+d,o=actx.createOscillator(),g=actx.createGain();
    o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.6,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.45);
    o.connect(g).connect(actx.destination);o.start(at);o.stop(at+.5)})}return delay}catch(e){return 0}}
let vibAt=0;
function alertNew(o){beep();
  // cada pedido tem sua própria campainha e vibração, uma depois da outra
  const now=Date.now(), at=Math.max(now,vibAt); vibAt=at+4300;
  setTimeout(()=>{try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400,150,600])}catch(e){}showBanner(o)},at-now);
  toast(`Novo pedido #${nº(o)} · ${o.customer_name}`);if(tab!=="pedidos"){unseen++;badge()}
  document.title=`(${D.orders.filter(x=>x.status==="novo").length}) Painel Fantasminha`}
function badge(){const b=$("#newBadge");b.textContent=unseen;b.hidden=!unseen}
const hhmm=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
let OF="novo", OQ="";
function renderOrders(){
  const FIN=["saiu","concluido","cancelado"], open=D.orders.filter(o=>!FIN.includes(o.status)), closed=D.orders.filter(o=>FIN.includes(o.status));

  document.title=`${open.filter(o=>o.status==="novo").length?`(${open.filter(o=>o.status==="novo").length}) `:""}Painel Fantasminha`;

  const done=D.orders.filter(o=>o.status==="saiu"||o.status==="concluido");

    <button class="${soundOn?"ghost":"btn"}" type="button" id="snd">${soundOn?"🔔 Som ligado":"Ligar som de alerta"}</button></div>
    ${soundOn?`<p class="hint">📱 A tela vai ficar <b>sempre ligada</b> enquanto o som estiver ativo, pra não perder pedido. Deixe o aparelho no carregador.</p>`:""}
    <div class="ofil">${F.map(([k,l,n])=>`<button type="button" class="chip${OF===k?" on":""}${k==="novo"&&n?" hot":""}" data-of="${k}"><span>${n}</span>${l}</button>`).join("")}</div>
    <input id="oq" type="search" placeholder="Buscar por nº, nome ou telefone" value="${esc(OQ)}" aria-label="Buscar pedido">
    <div class="olist">${list.map(card).join("")||`<p class="empty">${q?"Nenhum pedido encontrado.":"Nenhum pedido aqui."}</p>`}</div></section>`;
  $("#main").querySelectorAll("[data-of]").forEach(b=>b.onclick=()=>{OF=b.dataset.of;renderOrders()});
  const qi=$("#oq");qi.oninput=()=>{OQ=qi.value;const pos=qi.selectionStart;renderOrders();const n=$("#oq");n.focus();n.setSelectionRange(pos,pos)};
  $("#snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("fz_som",soundOn?"1":"0")}catch(e){}if(soundOn){actx=actx||new AudioContext();actx.resume();beep();keepAwake();startKeepAlive()}else{releaseAwake();stopKeepAlive()}renderOrders()};
}

  </article>`}

let SM={y:new Date().getFullYear(),m:new Date().getMonth(),by:"qty",rows:null,key:""};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let salesOk=false;
const pinHash=async p=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("fz-vendas:"+p)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function renderSalesLock(){
  if(!D.priv.sales_pin){$("#main").innerHTML='<section class="cat"><div class="cat-h"><h2>Vendas</h2></div><p class="empty">🔒 As vendas estão protegidas por senha, mas a senha ainda não foi criada.</p></section>';return}
  $("#main").innerHTML=`<section class="cat"><div class="cat-h"><h2>Vendas</h2></div>
   <form class="panel" id="pinF" style="max-width:360px;margin:24px auto;display:grid;gap:12px">
    <h3 style="margin:0">🔒 Área da chefe</h3><p class="hint" style="margin:0">Digite a senha pra ver as vendas.</p>
    <div class="f"><label for="pinIn">Senha</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" required></div>
    <button class="btn" type="submit">Entrar</button></form></section>`;
  $("#pinIn").focus();
  $("#pinF").onsubmit=async e=>{e.preventDefault();const v=$("#pinIn").value.trim();
    if(await pinHash(v)===D.priv.sales_pin){salesOk=true;renderSales()}else{$("#pinIn").value="";toast("Senha errada",true)}};
}
function changePin(){
  const box=$("#pinBox");box.hidden=false;box.innerHTML=`<form id="pinC" style="display:grid;gap:10px">
    <div class="f"><label for="np1">Nova senha</label><input id="np1" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" required></div>
    <div class="f"><label for="np2">Repita a nova senha</label><input id="np2" type="password" inputmode="numeric" autocomplete="new-password" required></div>
    <div class="acts2"><button class="btn" type="submit">Salvar senha</button><button class="ghost" type="button" id="pinX">Cancelar</button></div></form>`;
  $("#pinX").onclick=()=>{box.hidden=true;box.innerHTML=""};
  $("#pinC").onsubmit=async e=>{e.preventDefault();const a=$("#np1").value.trim(),b=$("#np2").value.trim();
    if(a.length<4)return toast("Use pelo menos 4 números",true);if(a!==b)return toast("As senhas não são iguais",true);
    const h=await pinHash(a);const {error}=await sb.from("private_settings").upsert({key:"sales_pin",value:h});if(error)return fail(error);
    D.priv.sales_pin=h;box.hidden=true;box.innerHTML="";toast("Senha trocada")};
}
async function renderSales(){
  if(!salesOk)return renderSalesLock();
  const key=SM.y+"-"+SM.m;
  if(SM.key!==key){SM.rows=null;SM.key=key;
    $("#main").innerHTML='<p class="empty">Carregando vendas…</p>';
    const a=new Date(SM.y,SM.m,1), b=new Date(SM.y,SM.m+1,1);
    const {data,error}=await sb.from("orders").select("id,created_at,status,mode,payment,items,subtotal,delivery_fee,total").gte("created_at",a.toISOString()).lt("created_at",b.toISOString()).order("created_at");
    if(error){$("#main").innerHTML='<p class="empty">Não foi possível carregar as vendas.</p>';return fail(error)}
    if(SM.key!==key)return; SM.rows=data;
  }
  const rows=SM.rows.filter(o=>o.status!=="cancelado"), canc=SM.rows.length-rows.length;
  const fat=rows.reduce((a,o)=>a+ +o.total,0), fee=rows.reduce((a,o)=>a+ +o.delivery_fee,0), n=rows.length;
  const prod={}; let units=0;
  rows.forEach(o=>o.items.forEach(it=>{const k=(it.number?it.number+". ":"")+it.name+(it.size?` (${it.size})`:"");const p=prod[k]||(prod[k]={nm:k,q:0,v:0});p.q+=it.qty;p.v+= +it.total;units+=it.qty}));
  const top=Object.values(prod).sort((a,b)=>SM.by==="qty"?b.q-a.q||b.v-a.v:b.v-a.v||b.q-a.q).slice(0,10);
  const maxTop=Math.max(1,...top.map(p=>SM.by==="qty"?p.q:p.v));
  const days=new Date(SM.y,SM.m+1,0).getDate(), perDay=Array.from({length:days},()=>({v:0,n:0}));
  rows.forEach(o=>{const d=new Date(o.created_at).getDate()-1;perDay[d].v+= +o.total;perDay[d].n++});
  const maxDay=Math.max(1,...perDay.map(d=>d.v)), best=perDay.reduce((bi,d,i)=>d.v>perDay[bi].v?i:bi,0);
  const pay={};rows.forEach(o=>{pay[o.payment]=(pay[o.payment]||0)+ +o.total});
  const ent=rows.filter(o=>o.mode==="entrega").length;
  const now=new Date(), isCur=SM.y===now.getFullYear()&&SM.m===now.getMonth();
  $("#main").innerHTML=`<section class="cat">
   <div class="cat-h"><h2>Vendas</h2><div class="mnav"><button class="ghost" type="button" data-mn="-1" aria-label="Mês anterior">‹</button><b>${MESES[SM.m]} ${SM.y}</b><button class="ghost" type="button" data-mn="1" aria-label="Próximo mês"${isCur?" disabled":""}>›</button></div></div>
   <div class="kpis">
     <div class="kpi"><span>Faturamento</span><b>${BRL(fat)}</b><small>${fee?`inclui ${BRL(fee)} de entrega`:"&nbsp;"}</small></div>
     <div class="kpi"><span>Pedidos</span><b>${n}</b><small>${canc?`${canc} cancelado(s) fora da conta`:"&nbsp;"}</small></div>
     <div class="kpi"><span>Ticket médio</span><b>${BRL(n?fat/n:0)}</b><small>por pedido</small></div>
     <div class="kpi"><span>Itens vendidos</span><b>${units}</b><small>${n?`${ent} entrega · ${n-ent} retirada`:"&nbsp;"}</small></div>
   </div>
   ${n?`<div class="panel"><div class="ph"><h3>Mais vendidos</h3><div class="seg sm"><button type="button" data-by="qty" class="${SM.by==="qty"?"on":""}">Quantidade</button><button type="button" data-by="val" class="${SM.by==="val"?"on":""}">Faturamento</button></div></div>
     <ol class="rank">${top.map((p,i)=>{const v=SM.by==="qty"?p.q:p.v;return `<li><span class="pos">${i+1}</span><div class="rk"><div class="rl"><b>${esc(p.nm)}</b><span>${SM.by==="qty"?`${p.q} un`:BRL(p.v)} <em>${SM.by==="qty"?BRL(p.v):`${p.q} un`}</em></span></div><div class="bar"><i style="width:${(v/maxTop*100).toFixed(1)}%"></i></div></div></li>`}).join("")}</ol></div>
   <div class="panel"><div class="ph"><h3>Faturamento por dia</h3><span class="hint">Melhor dia: ${best+1}/${SM.m+1} · ${BRL(perDay[best].v)}</span></div>
     <div class="days" style="--n:${days}">${perDay.map((d,i)=>`<div class="day${i===best&&d.v?" best":""}" tabindex="0" data-tip="${i+1}/${SM.m+1} · ${BRL(d.v)} · ${d.n} pedido(s)"><i style="height:${d.v?Math.max(3,d.v/maxDay*100):0}%"></i></div>`).join("")}</div>
     <div class="daxis"><span>1</span><span>${Math.ceil(days/2)}</span><span>${days}</span></div><div class="tip" id="tip" hidden></div></div>
   <div class="panel"><div class="ph"><h3>Formas de pagamento</h3></div>
     ${Object.entries(pay).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="payr"><span>${esc(k)}</span><div class="bar"><i style="width:${(v/fat*100).toFixed(1)}%"></i></div><b>${Math.round(v/fat*100)}%</b><em>${BRL(v)}</em></div>`).join("")}</div>`
   :`<p class="empty">Nenhuma venda em ${MESES[SM.m]} ${SM.y}.</p>`}
   <div class="acts2" style="margin-top:16px"><button class="ghost" type="button" id="lockS">🔒 Bloquear</button><button class="ghost" type="button" id="chPin">Trocar senha</button></div>
   <div class="panel" id="pinBox" hidden></div>
  </section>`;
  $("#lockS").onclick=()=>{salesOk=false;renderSales()};
  $("#chPin").onclick=changePin;
  $("#main").querySelectorAll("[data-mn]").forEach(b=>b.onclick=()=>{SM.m+= +b.dataset.mn;if(SM.m<0){SM.m=11;SM.y--}if(SM.m>11){SM.m=0;SM.y++}renderSales()});
  $("#main").querySelectorAll("[data-by]").forEach(b=>b.onclick=()=>{SM.by=b.dataset.by;renderSales()});
  const tip=$("#tip"); if(tip){const box=$(".days");
    const show=el=>{tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),pr=box.parentElement.getBoundingClientRect();tip.style.left=Math.min(pr.width-150,Math.max(0,r.left-pr.left-60))+"px";tip.style.top=(r.top-pr.top-34)+"px"};
    box.querySelectorAll(".day").forEach(d=>{d.onmouseenter=d.onfocus=()=>show(d);d.onclick=()=>show(d)});box.onmouseleave=()=>tip.hidden=true}
}

  const setS=async(k,v)=>{const {error}=await sb.from("settings").upsert({key:k,value:v});if(error){fail(error);return false}D.settings[k]=v;return true};
  $("#main").querySelectorAll("[data-ss]").forEach(b=>b.onclick=async()=>{if(await setS("status",b.dataset.ss)){toast({auto:"Seguindo o horário",closed:"Loja fechada para pedidos",open:"Loja aberta para pedidos"}[b.dataset.ss]);renderLoja()}});
  $("#main").querySelectorAll("[data-hd]").forEach(c=>c.onchange=()=>{const i=c.dataset.hd;$(`[data-ho="${i}"]`).disabled=!c.checked;$(`[data-hc="${i}"]`).disabled=!c.checked;c.closest(".hr").classList.toggle("off",!c.checked)});
  $("#saveH").onclick=async()=>{const out={};for(let i=0;i<7;i++){const on=$(`[data-hd="${i}"]`).checked,o=$(`[data-ho="${i}"]`).value,c=$(`[data-hc="${i}"]`).value;
      if(on&&(!o||!c))return toast(`Preencha o horário de ${DN[i]}`,true);if(on&&o===c)return toast(`${DN[i]}: abrir e fechar não podem ser iguais`,true);out[i]=on?{open:o,close:c}:null}
    if(await setS("hours",JSON.stringify(out)))toast("Horário salvo")};
  const setP=async(k,v)=>{const {error}=v===null?await sb.from("private_settings").delete().eq("key",k):await sb.from("private_settings").upsert({key:k,value:v});if(error){fail(error);return false}if(v===null)delete D.priv[k];else D.priv[k]=v;return true};
  $("#saveCmb").onclick=async()=>{const ph=$("#cmbPhone").value.replace(/\D/g,""),k=$("#cmbKey").value.trim();
    if(ph.length<12)return toast("Celular inválido. Use 55 + DDD + número",true);
    if(!k&&!D.priv.callmebot_key)return toast("Cole a chave que o CallMeBot mandou",true);
    if(!(await setP("callmebot_phone",ph)))return; if(k&&!(await setP("callmebot_key",k)))return;
    toast("Aviso no WhatsApp ligado");renderLoja()};
  if($("#offCmb"))$("#offCmb").onclick=async()=>{if(await setP("callmebot_key",null)){toast("Aviso desligado");renderLoja()}};
  $("#savePix").onclick=async()=>{const k=$("#pixKey").value.trim(),n=$("#pixName").value.trim();if(!k)return toast("Coloque a chave Pix",true);
    if(await setS("pix_key",k)&&await setS("pix_name",n))toast("Pix salvo")};
  $("#saveWa").onclick=async()=>{const v=$("#wa").value.replace(/\D/g,"");if(v.length<12)return toast("Número inválido. Use 55 + DDD + número",true);
    if(await setS("whatsapp",v))toast("WhatsApp salvo")};
}


function priceLabel(it){return it.sizes&&it.sizes.length?it.sizes.map(s=>`${s.label} ${money(s.price)}`).join(" · "):BRL(it.price)}
function renderItems(){
  $("#main").innerHTML=D.cats.map(c=>{
    const its=D.items.filter(i=>i.category_id===c.id);
    return `<section class="cat"><div class="cat-h"><h2>${esc(c.name)}</h2><button class="ghost" type="button" data-new="${esc(c.id)}">+ Novo item</button></div>
    ${its.map(i=>`<div class="row${i.available?"":" off"}">
      ${i.photo_url?`<img class="ph" src="${esc(i.photo_url)}" alt="" loading="lazy" width="56" height="56">`:`<span class="ph">sem<br>foto</span>`}
      <button class="info" type="button" data-edit="${i.id}"><b>${i.number?`<small>${i.number}</small>`:""}${esc(i.name)}</b><span>${priceLabel(i)}</span></button>
      <span class="swl"><span class="sw"><input type="checkbox" data-avail="${i.id}" ${i.available?"checked":""} aria-label="${esc(i.name)} disponível"><i></i></span>${i.available?"Disponível":"Esgotado"}</span>
    </div>`).join("")||'<p class="hint">Nenhum item.</p>'}</section>`}).join("");
}
$("#main").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed)return editItem(D.items.find(i=>i.id==ed.dataset.edit));
  const nw=e.target.closest("[data-new]"); if(nw)return editItem(null,nw.dataset.new);
});
$("#main").addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.avail){const it=D.items.find(i=>i.id==t.dataset.avail);const v=t.checked;
    const {error}=await sb.from("items").update({available:v,updated_at:new Date().toISOString()}).eq("id",it.id);
    if(error){t.checked=!v;return fail(error)} it.available=v;renderItems();toast(v?`${it.name} disponível`:`${it.name} marcado como esgotado`);return}
  if(t.dataset.lt){saveListRow(t.dataset.lt,t.dataset.id)}
});

/* ---------- editar item ---------- */
function openSheet(html){const s=$("#scrim");s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;document.body.style.overflow="hidden";return s.firstElementChild}
function closeSheet(){$("#scrim").hidden=true;$("#scrim").innerHTML="";document.body.style.overflow=""}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});

function editItem(it,catId){
  const isNew=!it;
  const st={photo:it?.photo_url||null,file:null,sized:!!(it?.sizes&&it.sizes.length)};
  const sz=l=>money(it?.sizes?.find(s=>s.label===l)?.price);
  const sh=openSheet(`<div class="sh-head"><h3>${isNew?"Novo item":"Editar item"}</h3><button class="close" type="button" data-x aria-label="Fechar">×</button></div>
  <div class="photo"><span class="pv" id="pv">sem foto</span><div class="acts">
    <span class="ghost file">${st.photo?"Trocar foto":"Adicionar foto"}<input type="file" id="ph" accept="image/*"></span>
    <button class="ghost" type="button" id="rmPh"${st.photo?"":" hidden"}>Remover foto</button>
    <p class="hint">Use uma foto em pé ou quadrada, com o lanche no centro.</p></div></div>
  <div class="g2"><div class="f"><label for="no">Número</label><input id="no" inputmode="numeric" value="${esc(it?.number??"")}"></div>
    <div class="f"><label for="nm">Nome</label><input id="nm" value="${esc(it?.name??"")}" required></div></div>
  <div class="f"><label for="ds">Ingredientes / descrição</label><textarea id="ds">${esc(it?.description??"")}</textarea></div>
  <div class="f"><label for="cat">Categoria</label><select id="cat">${D.cats.map(c=>`<option value="${esc(c.id)}"${c.id===(it?.category_id||catId)?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
  <div class="f"><span class="lbl"><label>Preço</label></span><div class="seg"><button type="button" data-mode="0" class="${st.sized?"":"on"}">Preço único</button><button type="button" data-mode="1" class="${st.sized?"on":""}">Tamanhos P / M / G</button></div></div>
  <div class="f" id="single"${st.sized?" hidden":""}><label for="pr">Valor (R$)</label><input id="pr" inputmode="decimal" value="${esc(money(it?.price))}" placeholder="0,00"></div>
  <div class="g3" id="sizes"${st.sized?"":" hidden"}>${["P","M","G"].map(l=>`<div class="f"><label for="s${l}">${l} (R$)</label><input id="s${l}" inputmode="decimal" value="${esc(sz(l))}" placeholder="0,00"></div>`).join("")}</div>
  <div class="f"><label for="op">Opções de escolha (opcional)</label><input id="op" value="${esc((it?.options||[]).join(", "))}" placeholder="Ex: Geleia de pimenta, Abacaxi"><p class="hint">Separe por vírgula. O cliente escolhe uma.</p></div>
  <div class="toggle-line"><span>Disponível no cardápio</span><span class="sw"><input type="checkbox" id="av" ${it?.available===false?"":"checked"} aria-label="Disponível"><i></i></span></div>
  <p class="err" id="er" hidden></p>
  <div class="foot">${isNew?"":`<span id="delWrap"><button class="danger" type="button" id="del">Excluir</button></span>`}<button class="btn" type="button" id="save">${isNew?"Criar item":"Salvar"}</button></div>`);

  const pv=()=>{const box=sh.querySelector("#pv");const src=st.file?URL.createObjectURL(st.file):st.photo;
    box.outerHTML=src?`<img class="pv" id="pv" src="${esc(src)}" alt="Foto do item">`:`<span class="pv" id="pv">sem foto</span>`;
    sh.querySelector("#rmPh").hidden=!src};
  pv();
  sh.querySelector("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return toast("Escolha um arquivo de imagem",true);st.file=f;pv()};
  sh.onclick=async e=>{
    if(e.target.closest("[data-x]"))return closeSheet();
    const m=e.target.closest("[data-mode]");if(m){st.sized=m.dataset.mode==="1";sh.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b===m));sh.querySelector("#single").hidden=st.sized;sh.querySelector("#sizes").hidden=!st.sized;return}
    if(e.target.id==="rmPh"){st.file=null;st.photo=null;sh.querySelector("#ph").value="";pv();return}
    if(e.target.id==="del"){sh.querySelector("#delWrap").innerHTML=`<span class="confirm">Excluir de vez? <button class="danger" type="button" id="delYes">Sim, excluir</button><button class="ghost" type="button" id="delNo">Não</button></span>`;return}
    if(e.target.id==="delNo"){sh.querySelector("#delWrap").innerHTML=`<button class="danger" type="button" id="del">Excluir</button>`;return}
    if(e.target.id==="delYes"){const {error}=await sb.from("items").delete().eq("id",it.id);if(error)return fail(error);D.items=D.items.filter(x=>x.id!==it.id);closeSheet();renderItems();toast("Item excluído");return}
    if(e.target.id==="save")save();
  };
  async function save(){
    const er=sh.querySelector("#er");er.hidden=true;const errMsg=m=>{er.textContent=m;er.hidden=false};
    const name=sh.querySelector("#nm").value.trim(); if(!name)return errMsg("Coloque o nome do item.");
    const noRaw=sh.querySelector("#no").value.trim(); const number=noRaw?parseInt(noRaw,10):null;
    if(noRaw&&isNaN(number))return errMsg("O número precisa ser só dígitos.");
    let price,sizes=null;
    if(st.sized){sizes=[];for(const l of ["P","M","G"]){const v=num(sh.querySelector("#s"+l).value);if(v!=null)sizes.push({label:l,price:v})}
      if(!sizes.length)return errMsg("Coloque o valor de pelo menos um tamanho.");price=sizes[0].price}
    else{price=num(sh.querySelector("#pr").value);if(price==null)return errMsg("Coloque o preço. Ex: 24,90");}
    const opts=sh.querySelector("#op").value.split(",").map(s=>s.trim()).filter(Boolean);
    const cat=sh.querySelector("#cat").value;
    const btn=sh.querySelector("#save");btn.disabled=true;btn.textContent="Salvando…";
    try{
      let photo=st.photo;
      if(st.file){btn.textContent="Enviando foto…";photo=await uploadPhoto(st.file,name)}
      const row={category_id:cat,number,name,description:sh.querySelector("#ds").value.trim()||null,price,sizes,options:opts.length?opts:null,photo_url:photo,available:sh.querySelector("#av").checked,updated_at:new Date().toISOString()};
      if(isNew){const maxSort=Math.max(0,...D.items.filter(x=>x.category_id===cat).map(x=>x.sort||0));row.sort=maxSort+1;
        const {data,error}=await sb.from("items").insert(row).select().single();if(error)throw error;D.items.push(data)}
      else{const {data,error}=await sb.from("items").update(row).eq("id",it.id).select().single();if(error)throw error;Object.assign(it,data)}
      closeSheet();renderItems();toast(isNew?"Item criado":"Salvo");
    }catch(e){btn.disabled=false;btn.textContent=isNew?"Criar item":"Salvar";fail(e)}
  }
}
async function uploadPhoto(file,name){
  const bmp=await createImageBitmap(file);
  const max=1000, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  let blob=await new Promise(r=>c.toBlob(r,"image/webp",.82)), ext="webp";
  if(!blob||blob.type!=="image/webp"){blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));ext="jpg"}
  const slug=name.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
  const path=`${slug}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type,cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}

/* ---------- acréscimos e taxas ---------- */
const LT={addons:{table:"addons",val:"price",title:"Acréscimos",ph:"Ex: Bacon",avail:true,hint:"Desligue para esconder um acréscimo que acabou."},
          fees:{table:"delivery_fees",val:"fee",title:"Taxas de entrega",ph:"Ex: Bela Vista",avail:false,hint:"O cliente escolhe o bairro e a taxa entra no total."}};
function renderList(k){
  const L=LT[k], rows=D[k];
  $("#main").innerHTML=`<section class="cat"><div class="cat-h"><h2>${L.title}</h2><button class="ghost" type="button" id="addRow">+ Adicionar</button></div><p class="hint">${L.hint} As mudanças salvam sozinhas.</p>
  <div class="list">${rows.map(r=>`<div class="lrow${L.avail?"":" nofee"}">
    <input data-lt="${k}" data-id="${r.id}" data-f="name" value="${esc(r.name)}" aria-label="Nome">
    <input data-lt="${k}" data-id="${r.id}" data-f="val" value="${esc(money(r[L.val]))}" inputmode="decimal" aria-label="Valor em reais">
    ${L.avail?`<span class="sw"><input type="checkbox" data-lt="${k}" data-id="${r.id}" data-f="available" ${r.available?"checked":""} aria-label="Disponível"><i></i></span>`:""}
    <button class="x" type="button" data-rm="${r.id}" aria-label="Excluir ${esc(r.name)}">×</button></div>`).join("")||'<p class="empty">Nada cadastrado.</p>'}</div></section>`;
  $("#addRow").onclick=async()=>{const row={name:"Novo",[L.val]:0,sort:Math.max(0,...rows.map(r=>r.sort||0))+1};
    const {data,error}=await sb.from(L.table).insert(row).select().single();if(error)return fail(error);D[k].push(data);renderList(k);
    const ins=document.querySelectorAll(`.lrow [data-f="name"]`);ins[ins.length-1]?.select()};
  $("#main").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="?";b.setAttribute("aria-label","Toque de novo para excluir");setTimeout(()=>{if(b.isConnected){b.dataset.sure="";b.textContent="×"}},3000);return}
    const {error}=await sb.from(L.table).delete().eq("id",b.dataset.rm);if(error)return fail(error);D[k]=D[k].filter(r=>r.id!=b.dataset.rm);renderList(k);toast("Excluído")});
}
async function saveListRow(k,id){
  const L=LT[k], r=D[k].find(x=>x.id==id), q=f=>document.querySelector(`[data-lt="${k}"][data-id="${id}"][data-f="${f}"]`);
  const name=q("name").value.trim(), val=num(q("val").value);
  if(!name)return toast("O nome não pode ficar vazio",true);
  if(val==null)return toast("Valor inválido. Ex: 3,50",true);
  const upd={name,[L.val]:val}; if(L.avail)upd.available=q("available").checked;
  const {error}=await sb.from(L.table).update(upd).eq("id",id);if(error)return fail(error);
  Object.assign(r,upd);q("val").value=money(val);toast("Salvo");
}

try{if(localStorage.getItem("fz_som")==="1"){const arm=()=>{if(!soundOn&&$("#app")&&!$("#app").hidden){soundOn=true;actx=actx||new AudioContext();actx.resume();keepAwake();startKeepAlive();if(tab==="pedidos")renderOrders();toast("🔔 Som de alerta ligado")}removeEventListener("pointerdown",arm)};addEventListener("pointerdown",arm)}}catch(e){}
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){$("#app").hidden=true;$("#login").hidden=false}});
boot();
