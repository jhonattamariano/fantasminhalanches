<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0b">
<title>Painel Fantasminha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Painel de gestão mobile-first: lista por categoria, folha inferior para editar. Mesmo visual do cardápio. */
:root{
  --bg:#0f0d0b; --surface:#1b1814; --surface2:#26221c; --line:#3a332a;
  --fg:#f6efe4; --muted:#b3a794; --accent:#ffa21a; --accent-ink:#1a1206;
  --ok:#5fd38a; --bad:#ff8f7a;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
input,select,textarea{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.f{display:grid;gap:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.btn:disabled{opacity:.5;cursor:wait}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600}
.danger{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600}
.err{color:var(--bad);margin:0;font-size:14px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.login form{width:100%;max-width:360px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{font-size:40px;line-height:.95}
.login h1 span{color:var(--accent)}
.login p{margin:0;color:var(--muted);font-size:14px}

/* topo */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.top h1{font-size:28px;flex:1;min-width:0}
.top h1 span{color:var(--accent)}
.top a{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;width:100%;overflow-x:auto}
.tab{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{padding-block:8px 80px}
.cat{padding-top:22px;display:grid;gap:10px}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cat-h h2{font-size:28px;color:var(--accent)}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.row.off{opacity:.55}
.row .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;line-height:1.1}
.row .info{min-width:0;background:none;border:0;text-align:left;padding:0;display:grid;gap:2px}
.row .info b{font-weight:700;overflow-wrap:anywhere}
.row .info b small{color:var(--muted);margin-right:6px}
.row .info span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.swl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}

/* listas simples (acréscimos, entrega) */
.list{display:grid;gap:8px;padding-top:18px}
.lrow{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.lrow.nofee{grid-template-columns:1fr 110px auto}
.lrow .x{background:none;border:0;color:var(--muted);font-size:22px;width:32px;height:32px}
@media (max-width:440px){.lrow{grid-template-columns:1fr 92px auto auto}}

/* folha */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh-head h3{font-size:30px}
.close{background:var(--surface2);border:0;border-radius:999px;width:36px;height:36px;font-size:20px}
.photo{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.photo .pv{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.photo .acts{display:grid;gap:8px;justify-items:start}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.g2{display:grid;grid-template-columns:110px 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot .btn{flex:1}
.hint{color:var(--muted);font-size:13px;margin:0}
.toggle-line{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--bad);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{background:var(--bad)}
.empty{color:var(--muted);padding-block:30px;text-align:center}
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--bad);color:#1a0703;font-size:12px;margin-left:4px;padding:0 5px}
.olist{display:grid;gap:10px;padding-top:6px}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;border-left:5px solid var(--line)}
.ord.st-novo{border-left-color:var(--accent);box-shadow:0 0 0 1px rgba(255,162,26,.35)}
.ord.st-concluido,.ord.st-cancelado{opacity:.6}
.ord header{display:flex;align-items:center;gap:10px}
.ord header b{font-family:var(--display);font-size:28px;font-weight:400;letter-spacing:.02em}
.pill{border:1px solid var(--c);color:var(--c);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.when{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.who a{color:var(--accent)}
.addr span{color:var(--muted)}
.its{list-style:none;margin:0;padding:10px 0;border-block:1px dashed var(--line);display:grid;gap:8px}
.its .sub{color:var(--muted);font-size:14px;padding-left:14px}
.its .obs{display:inline-block;margin-top:3px;background:var(--fg);color:var(--bg);font-weight:700;padding:1px 6px;border-radius:4px;font-size:14px}
.foot2{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.foot2 b{font-size:20px}
.resend{color:var(--accent);font-size:14px}
.mnav{display:flex;align-items:center;gap:8px}.mnav b{min-width:130px;text-align:center}.mnav .ghost{padding:6px 12px}.mnav .ghost:disabled{opacity:.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.kpi span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums}.kpi small{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ph h3{font-size:24px}
.seg.sm{grid-template-columns:auto auto}.seg.sm button{padding:6px 10px;font-size:13px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center}
.pos{color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rk{display:grid;gap:4px;min-width:0}.rl{display:flex;justify-content:space-between;gap:10px}.rl b{min-width:0;overflow-wrap:anywhere}
.rl span{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}.rl em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.days{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;height:140px;align-items:end;border-bottom:1px solid var(--line)}
.day{height:100%;display:flex;align-items:flex-end;cursor:pointer;outline-offset:1px}.day i{display:block;width:100%;background:var(--accent);opacity:.55;border-radius:3px 3px 0 0}
.day.best i,.day:hover i,.day:focus i{opacity:1}
.daxis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tip{position:absolute;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:5px 9px;border-radius:6px;pointer-events:none;white-space:nowrap}
.payr{display:grid;grid-template-columns:80px 1fr 44px 90px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}.payr b{text-align:right}.payr em{font-style:normal;color:var(--muted);text-align:right;font-size:14px}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 .btn{flex:1;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center}.acts2 .btn small{font-weight:600;font-size:12px;opacity:.75}
</style>
</head>
<body>

<section class="login wrap" id="login" hidden>
  <form id="loginForm">
    <h1>Painel <span>Fantasminha</span></h1>
    <p>Entre para mudar preços, fotos e itens do cardápio.</p>
    <div class="f"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="f"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn" id="loginBtn" type="submit">Entrar</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <h1>Painel <span>Fantasminha</span></h1>
    <a href="./" target="_blank" rel="noopener">Ver cardápio</a>
    <button class="ghost" id="logout" type="button">Sair</button>
    <nav class="tabs" aria-label="Seções">
      <button class="tab on" type="button" data-tab="pedidos">Pedidos <span id="newBadge" class="nb" hidden>0</span></button>
      <button class="tab" type="button" data-tab="vendas">Vendas</button>
      <button class="tab" type="button" data-tab="itens">Cardápio</button>
      <button class="tab" type="button" data-tab="addons">Acréscimos</button>
      <button class="tab" type="button" data-tab="fees">Taxas de entrega</button>
      <button class="tab" type="button" data-tab="loja">Loja</button>
    </nav>
  </div></header>
  <main class="wrap" id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://hoqssxvzyxkakwwtqstg.supabase.co", SB_KEY="sb_publishable_e_Ng5FaQreX1xhhlloOoIw_SE-PoAd3";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BRL=v=>"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/\s|R\$/g,"").replace(",","."));return isNaN(n)?null:Math.round(n*100)/100};
const money=v=>v==null?"":Number(v).toFixed(2).replace(".",",");
let D={cats:[],items:[],addons:[],fees:[],orders:[],settings:{}}, tab="pedidos", soundOn=false, unseen=0;

let tt; function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.classList.toggle("bad",!!bad);t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,bad?4000:1800)}
function fail(e){console.error(e);toast(e?.message?.includes("row-level")?"Sem permissão. Confira se seu e-mail está na lista de admins.":"Não salvou: "+(e?.message||"erro"),true)}

/* ---------- login ---------- */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#login").hidden=false;$("#app").hidden=true;return}
  const {data:ok,error}=await sb.rpc("is_admin");
  if(error||!ok){await sb.auth.signOut();showLoginErr(error?"Não foi possível verificar o acesso.":"Este e-mail não tem acesso ao painel.");$("#login").hidden=false;$("#app").hidden=true;return}
  $("#login").hidden=true;$("#app").hidden=false;load();
}
function showLoginErr(m){const e=$("#loginErr");e.textContent=m;e.hidden=false}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();$("#loginErr").hidden=true;const b=$("#loginBtn");b.disabled=true;b.textContent="Entrando…";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  b.disabled=false;b.textContent="Entrar";
  if(error)return showLoginErr(error.message.includes("Invalid")?"E-mail ou senha incorretos.":error.message);
  boot();
});
$("#logout").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---------- dados ---------- */
async function load(){
  $("#main").innerHTML='<p class="empty">Carregando…</p>';
  const [c,i,a,f]=await Promise.all([sb.from("categories").select("*").order("sort"),sb.from("items").select("*").order("sort"),sb.from("addons").select("*").order("sort"),sb.from("delivery_fees").select("*").order("sort")]);
  const err=c.error||i.error||a.error||f.error;
  if(err){$("#main").innerHTML='<p class="empty">Não foi possível carregar. Atualize a página.</p>';return fail(err)}
  D={...D,cats:c.data,items:i.data,addons:a.data,fees:f.data};
  const st=await sb.from("settings").select("*");(st.data||[]).forEach(x=>D.settings[x.key]=x.value);
  await loadOrders();listenOrders();render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
function render(){({vendas:renderSales,pedidos:renderOrders,itens:renderItems,addons:()=>renderList("addons"),fees:()=>renderList("fees"),loja:renderLoja})[tab]();if(tab==="pedidos"){unseen=0;badge()}}

/* ---------- pedidos ---------- */
const ST={novo:["Novo","#ffa21a"],preparo:["Em preparo","#6cb4ff"],saiu:["Saiu / pronto","#c38bff"],concluido:["Concluído","#5fd38a"],cancelado:["Cancelado","#ff8f7a"]};
const NEXT={novo:["preparo","Começar preparo"],preparo:["saiu","Saiu pra entrega / pronto"],saiu:["concluido","Concluir"]};
const SZ={P:"Pequeno",M:"Médio",G:"Grande"};
function custMsg(o,to){
  const n=String(o.customer_name).trim().split(" ")[0], h=new Date().getHours();
  const oi=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  const head={
    preparo:`${oi}, ${n}! 👻\nObrigado por pedir com a gente na *Fantasminha Lanches*! 🧡\n\nSeu pedido *#${o.id}* foi *confirmado* e já está sendo preparado. 🍔🔥`,
    saiu:o.mode==="entrega"
      ?`${oi}, ${n}! 👻🛵\nBoas notícias: seu pedido *#${o.id}* acabou de *sair para entrega*!\nNosso entregador já está a caminho e o seu lanche vai chegar quentinho. 🔥\n\n✅ Deixe o pagamento separado pra agilizar a entrega\n✅ Fique de olho no celular, se precisarmos a gente te chama por aqui`
      :`${oi}, ${n}! 👻🍔\nSeu pedido *#${o.id}* está *prontinho* e esperando por você no balcão!\nÉ só chegar e informar o número *#${o.id}*. 😉`,
    concluido:`${oi}, ${n}! 👻🧡\nSeu pedido *#${o.id}* foi *${o.mode==="entrega"?"entregue":"retirado"}* com sucesso.\n\nMuito obrigado por escolher a *Fantasminha Lanches*! Esperamos que tenha sido assombrosamente gostoso. 😋\n\n⭐ Se puder, conta pra gente o que achou. Sua opinião ajuda demais!`,
    cancelado:`${oi}, ${n}. 👻\nInfelizmente seu pedido *#${o.id}* foi *cancelado*.\nSe tiver qualquer dúvida, é só responder esta mensagem.`}[to];
  if(!head)return "";
  const L=[head,"",to==="concluido"?"🧾 *Resumo do seu pedido:*":"🧾 *Seu pedido:*"];
  o.items.forEach(it=>{L.push(`• ${it.qty}x ${it.name}${it.size?` (${SZ[it.size]||it.size})`:""}${it.option?` · ${it.option}`:""} · ${BRL(it.total)}`);
    it.addons.forEach(a=>L.push(`   + ${a.qty}x ${a.name}`));if(it.obs)L.push(`   _Obs: ${it.obs}_`)});
  L.push("");
  if(+o.delivery_fee)L.push(`Subtotal: ${BRL(o.subtotal)}`,`Entrega: ${BRL(o.delivery_fee)}`);
  L.push(`💰 *Total: ${BRL(o.total)}*`,`💳 Pagamento: ${o.payment}${o.change_for?` (troco para R$ ${o.change_for})`:""}`);
  L.push(o.mode==="entrega"?`📍 Entrega: ${o.street}, ${o.number} · ${o.district}${o.complement?` (${o.complement})`:""}`:"📍 Retirada no balcão");
  L.push("",({preparo:"Qualquer dúvida, é só chamar por aqui! 👻🍔",
    saiu:o.mode==="entrega"?"Bom apetite! 👻🍔":"Te esperamos! 👻🍔",
    concluido:`Bateu a fome de novo? Peça pelo nosso cardápio:\n👉 ${location.origin}\n\nAté a próxima! 👻🍔`,
    cancelado:"Pedimos desculpas pelo transtorno. 👻"})[to]);
  return L.join("\n");
}
function openWa(url){let w=null;try{w=window.open(url,"_blank")}catch(e){}if(!w)location.href=url}
const waCust=(o,to)=>`https://wa.me/55${String(o.phone).replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"")}?text=${encodeURIComponent(custMsg(o,to))}`;
function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}
async function loadOrders(){const {data,error}=await sb.from("orders").select("*").gte("created_at",dayStart()).order("created_at",{ascending:false});if(error)return fail(error);D.orders=data}
let chan;
function listenOrders(){if(chan)return;
  chan=sb.channel("pedidos").on("postgres_changes",{event:"*",schema:"public",table:"orders"},pl=>{
    if(pl.eventType==="INSERT"){D.orders.unshift(pl.new);alertNew(pl.new)}

      closeSheet();renderItems();toast(isNew?"Item criado":"Salvo");
    }catch(e){btn.disabled=false;btn.textContent=isNew?"Criar item":"Salvar";fail(e)}
  }
}
async function uploadPhoto(file,name){
  const bmp=await createImageBitmap(file);
  const max=1000, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  let blob=await new Promise(r=>c.toBlob(r,"image/webp",.82)), ext="webp";
  if(!blob||blob.type!=="image/webp"){blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));ext="jpg"}
  const slug=name.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
  const path=`${slug}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from("fotos").upload(path,blob,{contentType:blob.type,cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
}

/* ---------- acréscimos e taxas ---------- */
const LT={addons:{table:"addons",val:"price",title:"Acréscimos",ph:"Ex: Bacon",avail:true,hint:"Desligue para esconder um acréscimo que acabou."},
          fees:{table:"delivery_fees",val:"fee",title:"Taxas de entrega",ph:"Ex: Bela Vista",avail:false,hint:"O cliente escolhe o bairro e a taxa entra no total."}};
function renderList(k){
  const L=LT[k], rows=D[k];
  $("#main").innerHTML=`<section class="cat"><div class="cat-h"><h2>${L.title}</h2><button class="ghost" type="button" id="addRow">+ Adicionar</button></div><p class="hint">${L.hint} As mudanças salvam sozinhas.</p>
  <div class="list">${rows.map(r=>`<div class="lrow${L.avail?"":" nofee"}">
    <input data-lt="${k}" data-id="${r.id}" data-f="name" value="${esc(r.name)}" aria-label="Nome">
    <input data-lt="${k}" data-id="${r.id}" data-f="val" value="${esc(money(r[L.val]))}" inputmode="decimal" aria-label="Valor em reais">
    ${L.avail?`<span class="sw"><input type="checkbox" data-lt="${k}" data-id="${r.id}" data-f="available" ${r.available?"checked":""} aria-label="Disponível"><i></i></span>`:""}
    <button class="x" type="button" data-rm="${r.id}" aria-label="Excluir ${esc(r.name)}">×</button></div>`).join("")||'<p class="empty">Nada cadastrado.</p>'}</div></section>`;
  $("#addRow").onclick=async()=>{const row={name:"Novo",[L.val]:0,sort:Math.max(0,...rows.map(r=>r.sort||0))+1};
    const {data,error}=await sb.from(L.table).insert(row).select().single();if(error)return fail(error);D[k].push(data);renderList(k);
    const ins=document.querySelectorAll(`.lrow [data-f="name"]`);ins[ins.length-1]?.select()};
  $("#main").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="?";b.setAttribute("aria-label","Toque de novo para excluir");setTimeout(()=>{if(b.isConnected){b.dataset.sure="";b.textContent="×"}},3000);return}
    const {error}=await sb.from(L.table).delete().eq("id",b.dataset.rm);if(error)return fail(error);D[k]=D[k].filter(r=>r.id!=b.dataset.rm);renderList(k);toast("Excluído")});
}
async function saveListRow(k,id){
  const L=LT[k], r=D[k].find(x=>x.id==id), q=f=>document.querySelector(`[data-lt="${k}"][data-id="${id}"][data-f="${f}"]`);
  const name=q("name").value.trim(), val=num(q("val").value);
  if(!name)return toast("O nome não pode ficar vazio",true);
  if(val==null)return toast("Valor inválido. Ex: 3,50",true);
  const upd={name,[L.val]:val}; if(L.avail)upd.available=q("available").checked;
  const {error}=await sb.from(L.table).update(upd).eq("id",id);if(error)return fail(error);
  Object.assign(r,upd);q("val").value=money(val);toast("Salvo");
}

sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){$("#app").hidden=true;$("#login").hidden=false}});
boot();
</script>
