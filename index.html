<style>
/* Layout: app de pedido mobile-first, abas de categoria fixas, folha inferior para item e checkout. Visual escuro fixo seguindo o cardápio impresso (preto + laranja). */
:root{
  --bg:#0f0d0b; --surface:#1b1814; --surface2:#26221c; --line:#3a332a;
  --fg:#f6efe4; --muted:#b3a794; --accent:#ffa21a; --accent-ink:#1a1206;
  --ok:#5fd38a; --paper:#fbf9f4; --paper-ink:#141414;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.herowrap{position:relative;overflow:hidden;background:var(--bg)}
.hero{padding-block:28px 22px;display:grid;grid-template-columns:1fr;align-items:center;gap:10px 18px}
.hero .txt{display:grid;gap:10px;min-width:0;position:relative;z-index:1}
.brand{display:flex;justify-content:center;margin:0}
.hero .meta{justify-content:center;text-align:center}
.hero .demo{justify-self:center}
.logo{width:min(88vw,400px);height:auto;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));max-width:100%;animation:boo 4.2s ease-in-out infinite;transform-origin:50% 60%;cursor:pointer}
.logo:hover,.logo.spin{animation:boo-hi .9s ease-in-out}
@keyframes boo{0%,100%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-7px) rotate(3deg)}50%{transform:translateY(-3px) rotate(-2deg)}75%{transform:translateY(-9px) rotate(4deg)}}
@keyframes boo-hi{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-12deg)}60%{transform:scale(1.08) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.done-logo{width:170px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:cheer 1.1s cubic-bezier(.3,1.6,.5,1) both,boo 4.2s ease-in-out 1.1s infinite}
@keyframes cheer{0%{transform:translateY(40px) scale(.4) rotate(-20deg);opacity:0}60%{transform:translateY(-14px) scale(1.08) rotate(8deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}
.buddy{position:fixed;z-index:4;width:78px;pointer-events:none;right:calc(-14px - env(safe-area-inset-right,0px));top:calc(110px + var(--p,0) * (100vh - 300px));transition:top .9s cubic-bezier(.22,.9,.3,1),opacity .4s;opacity:0}
.buddy.show{opacity:1}
.buddy img{width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));display:block;animation:boo 4.2s ease-in-out infinite;transform-origin:50% 60%}
.buddy.down img{animation:boo 4.2s ease-in-out infinite;rotate:8deg}
.buddy.up img{rotate:-8deg}
.buddy.hop img{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-26px) scale(1.15) rotate(-10deg)}100%{transform:translateY(0) scale(1)}}
@media (min-width:860px){.buddy{right:auto;left:calc(50% + 380px);width:120px}}
@media (prefers-reduced-motion:reduce){.logo,.logo:hover,.logo.spin,.done-logo,.buddy img,.buddy.hop img{animation:none}.buddy{transition:opacity .4s}}
.hero>img{width:100%;height:auto;aspect-ratio:auto;border-radius:14px;justify-self:stretch;filter:drop-shadow(0 18px 28px rgba(0,0,0,.55));animation:pop .5s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.hero>img{animation:none}}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero>img{border-radius:10px}}
.demo{justify-self:start;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:3px 8px;border-radius:4px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,72px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:14px}
.meta b{color:var(--ok);font-weight:600}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* lista */
main{padding-bottom:120px}
section{padding-top:26px;scroll-margin-top:70px}
section h2{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.02em;margin:0 0 4px;color:var(--accent)}
section .sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.item{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 14px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.item:hover .nm{color:var(--accent)}
.item.off{opacity:.45;cursor:not-allowed}
.item.off:hover .nm{color:inherit}
.pr.soldout{background:var(--surface2);color:var(--muted);font-family:var(--body);font-size:13px;font-weight:700;text-transform:uppercase;padding:8px 10px}
.state{padding-block:48px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.state button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.item.ph{grid-template-columns:72px 1fr auto}
.item.ph .nm,.item.ph .ds{grid-column:2}
.item.ph .pr{grid-column:3}
.thumb{grid-row:1/span 2;grid-column:1;width:72px;height:72px;border-radius:10px;object-fit:cover;align-self:center;background:var(--surface2)}
.sh-photo{width:min(100%,52vh);height:auto;justify-self:center;aspect-ratio:1/1;object-fit:cover;border-radius:12px;max-width:100%;background:var(--surface2)}
.nm{font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.01em;min-width:0}
.nm small{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.ds{grid-column:1;color:var(--muted);font-size:14px;text-transform:lowercase;min-width:0}
.ds::first-letter{text-transform:uppercase}
.pr{grid-row:1/span 2;grid-column:2;align-self:center;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:24px;line-height:1;padding:7px 9px 5px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr i{font-style:normal;font-size:14px;vertical-align:top;margin-right:2px}
.pr.from::before{content:"a partir de";display:block;font-family:var(--body);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fees{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.fees h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px;letter-spacing:.03em}
.fees ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fees li{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fees li b{color:var(--fg)}

/* barra do carrinho */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;background:linear-gradient(transparent,var(--bg) 30%)}
.cartbar .wrap{display:flex}
.cartbtn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cartbtn .n{background:var(--accent-ink);color:var(--accent);border-radius:999px;min-width:26px;height:26px;display:inline grid;place-items:center;font-size:14px;margin-right:8px}

/* folha inferior */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet.still{animation:none}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h3{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;margin:0;letter-spacing:.02em}
.sh-head p{margin:6px 0 0;color:var(--muted);font-size:14px;text-transform:lowercase}
.x{background:var(--surface2);border:0;border-radius:999px;width:36px;height:36px;flex:none;font-size:20px;line-height:1}
.grp{display:grid;gap:8px}
.grp>label,.grp>.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt.on{border-color:var(--accent)}
.opt span{min-width:0}
.opt em{font-style:normal;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.seg button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button small{display:block;font-weight:500;font-size:13px;opacity:.8}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.step b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
input,select,textarea{width:100%;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addr{display:grid;grid-template-columns:1fr 96px;gap:10px}
input.bad{border-color:#ff8f7a;box-shadow:0 0 0 1px #ff8f7a}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;color:var(--fg);text-align:center;text-decoration:none}
.cl{display:grid;gap:0}
.cl .ln{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl .ln p{margin:0;color:var(--muted);font-size:13px;min-width:0}
.cl .ln .rm{grid-column:2;justify-self:end;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.tot{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;color:var(--muted)}
.tot div.big{color:var(--fg);font-weight:700;font-size:19px}
.err{color:#ff8f7a;font-size:14px;margin:0}

/* comanda térmica 58mm */
.done{display:grid;gap:14px;justify-items:center;text-align:center}
.done h3{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--ok)}
.done p{margin:0;color:var(--muted);max-width:46ch}
.ticket{background:var(--paper);color:var(--paper-ink);font-family:var(--mono);font-weight:500;width:min(100%,300px);padding:16px 14px 22px;text-align:left;font-size:13px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.5);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x}
.ticket .c{text-align:center}
.ticket .xl{font-size:26px;font-weight:800;line-height:1.1}
.ticket .lg{font-size:17px;font-weight:800}
.ticket hr{border:0;border-top:2px dashed var(--paper-ink);margin:8px 0}
.ticket .it{margin:6px 0}
.ticket .ob{font-weight:800;background:var(--paper-ink);color:var(--paper);padding:1px 4px;display:inline-block;margin-top:2px}
.ticket .sm{font-size:12px}
.ticket .rw{display:flex;justify-content:space-between;gap:8px}
.ticketcap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
</style>
</head>

    const ph=it[6], off=!it[7];
    return `<button class="item${ph?" ph":""}${off?" off":""}" type="button" data-k="${key}"${off?" disabled":""}>${ph?`<img class="thumb" src="${ph}" alt="" loading="lazy" width="72" height="72">`:""}<span class="nm">${it[0]?`<small>${it[0]}</small>`:""}${it[1]}</span>${off?`<span class="pr soldout">Esgotado</span>`:priceHTML(p,!!it[4])}${it[2]?`<span class="ds">${it[2]}</span>`:""}</button>`}).join("")}</section>`).join("")+
  `<div class="fees"><h3>Taxa de entrega</h3><ul>${FEES.map(f=>`<li><span>${f[0]}</span><b>${BRL(f[1])}</b></li>`).join("")}</ul></div>`;
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go]"); if(t){document.getElementById(t.dataset.go).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});return}
  const it=e.target.closest(".item"); if(it){openItem(it.dataset.k);return}
  if(e.target===$("#scrim")) close();
});
function watchTabs(){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.go===en.target.id;b.classList.toggle("on",on);if(on)b.scrollIntoView({block:"nearest",inline:"center"})})}}),{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section").forEach(s=>io.observe(s));}

function open(html){const s=$("#scrim");const re=!s.hidden;s.innerHTML=`<div class="sheet${re?" still":""}" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;document.body.style.overflow="hidden"}
function close(){$("#scrim").hidden=true;$("#scrim").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)close()});

function openItem(k){
  const it=items[k]; const st={size:it.sizes?0:null,choice:0,adds:{},qty:1,obs:""};
  const draw=()=>{
    const base=it.sizes?it.sizes[st.size][1]:it.price;
    const addT=Object.entries(st.adds).reduce((a,[i,q])=>a+ADD[i][1]*q,0);
    const tot=(base+addT)*st.qty;
    open(`${it.photo?`<img class="sh-photo" src="${esc(it.photo)}" alt="${it.nm}" width="720" height="720">`:""}<div class="sh-head"><div><h3>${it.no?it.no+". ":""}${it.nm}</h3>${it.ds?`<p>${it.ds}</p>`:""}</div><button class="x" type="button" data-a="x" aria-label="Fechar">×</button></div>
    ${it.sizes?`<div class="grp"><span class="lbl">Tamanho</span><div class="seg">${it.sizes.map((s,i)=>`<button type="button" class="${i===st.size?"on":""}" data-a="size" data-i="${i}">${{P:"Pequeno",M:"Médio",G:"Grande"}[s[0]]}<small>${BRL(s[1])}</small></button>`).join("")}</div></div>`:""}
    ${it.choice?`<div class="grp"><span class="lbl">Escolha</span><div class="seg">${it.choice.map((c,i)=>`<button type="button" class="${i===st.choice?"on":""}" data-a="choice" data-i="${i}">${c}</button>`).join("")}</div></div>`:""}
    ${it.cat.add?`<div class="grp"><span class="lbl">Acréscimos</span><div class="opts">${ADD.map((a,i)=>{const q=st.adds[i]||0;return `<div class="opt${q?" on":""}"><span>${a[0]} <em>+ ${BRL(a[1])}</em></span><span class="step"><button type="button" data-a="sub" data-i="${i}" aria-label="Tirar ${a[0]}">−</button><b>${q}</b><button type="button" data-a="add" data-i="${i}" aria-label="Adicionar ${a[0]}">+</button></span></div>`}).join("")}</div></div>`:""}
    <div class="grp"><label for="obs">Observação</label><textarea id="obs" placeholder="Ex: sem cebola, ponto da carne, molho à parte">${esc(st.obs)}</textarea></div>
    <div class="grp"><span class="lbl">Quantidade</span><span class="step"><button type="button" data-a="q-" aria-label="Menos">−</button><b>${st.qty}</b><button type="button" data-a="q+" aria-label="Mais">+</button></span></div>
    <button class="primary" type="button" data-a="ok"><span>Adicionar ao pedido</span><span>${BRL(tot)}</span></button>`);
    const sh=$(".sheet"); const y=sh.dataset.y;
    sh.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;st.obs=$("#obs").value;const a=b.dataset.a,i=+b.dataset.i;const keep=sh.scrollTop;
      if(a==="x")return close();
      if(a==="size")st.size=i; if(a==="choice")st.choice=i;
      if(a==="add")st.adds[i]=(st.adds[i]||0)+1; if(a==="sub"&&st.adds[i]){st.adds[i]--; if(!st.adds[i])delete st.adds[i]}
      if(a==="q+")st.qty++; if(a==="q-"&&st.qty>1)st.qty--;
      if(a==="ok"){cart.push({nm:(it.no?it.no+". ":"")+it.nm,size:it.sizes?it.sizes[st.size][0]:null,choice:it.choice?it.choice[st.choice]:null,adds:Object.entries(st.adds).map(([i,q])=>({nm:ADD[i][0],q,v:ADD[i][1]})),obs:st.obs.trim(),qty:st.qty,unit:base+addT});close();updBar();window.buddyHop&&buddyHop();return}
      draw();$(".sheet").scrollTop=keep};
  };
  draw();
}
function sub(){return cart.reduce((a,l)=>a+l.unit*l.qty,0)}
function updBar(){const n=cart.reduce((a,l)=>a+l.qty,0);$("#cartbar").hidden=!n;$("#cartN").textContent=n;$("#cartT").textContent=BRL(sub())}
$("#openCart").onclick=()=>checkout();

const ck={name:"",phone:"",cpf:"",mode:"entrega",bairro:0,rua:"",num:"",bai:"",comp:"",pay:"Pix",troco:""};
const digits=v=>String(v).replace(/\D/g,"");
function cpfOk(v){const c=digits(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
  for(const n of [9,10]){let t=0;for(let i=0;i<n;i++)t+=+c[i]*(n+1-i);const d=(t*10)%11%10;if(d!==+c[n])return false}return true}
const maskCpf=v=>{const c=digits(v).slice(0,11);return c.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/(\d{3})\.(\d{3})\.(\d{3})(\d)/,"$1.$2.$3-$4")};
const maskTel=v=>{const c=digits(v).slice(0,11);if(c.length<=2)return c;if(c.length<=6)return `(${c.slice(0,2)}) ${c.slice(2)}`;if(c.length<=10)return `(${c.slice(0,2)}) ${c.slice(2,6)}-${c.slice(6)}`;return `(${c.slice(0,2)}) ${c.slice(2,3)} ${c.slice(3,7)}-${c.slice(7)}`};
let badF=[];
const fld=(id,label,val,extra="")=>`<div class="grp"><label for="${id}">${label}</label><input id="${id}" value="${esc(val)}"${badF.includes(id)?' class="bad" aria-invalid="true"':""} ${extra}></div>`;
function lineDesc(l){return [l.size&&({P:"Pequeno",M:"Médio",G:"Grande"}[l.size]),l.choice,...l.adds.map(a=>`+${a.q>1?a.q+"x ":""}${a.nm}`),l.obs&&`Obs: ${l.obs}`].filter(Boolean).join(" · ")}
function checkout(err){
  const fee=ck.mode==="entrega"?FEES[ck.bairro][1]:0, s=sub();
  open(`<div class="sh-head"><div><h3>Seu pedido</h3></div><button class="x" type="button" data-a="x" aria-label="Fechar">×</button></div>
  <div class="cl">${cart.map((l,i)=>`<div class="ln"><strong>${l.qty}x ${l.nm}</strong><span>${BRL(l.unit*l.qty)}</span>${lineDesc(l)?`<p>${esc(lineDesc(l))}</p>`:"<p></p>"}<button class="rm" type="button" data-a="rm" data-i="${i}">remover</button></div>`).join("")}</div>
  ${fld("ck-name","Seu nome",ck.name,'autocomplete="name"')}
  <div class="row2">${fld("ck-phone","WhatsApp",ck.phone,'inputmode="tel" autocomplete="tel" placeholder="(31) 9 0000-0000"')}
  ${fld("ck-cpf","CPF",ck.cpf,'inputmode="numeric" placeholder="000.000.000-00"')}</div>
  <div class="grp"><span class="lbl">Como vai receber</span><div class="seg"><button type="button" data-a="mode" data-v="entrega" class="${ck.mode==="entrega"?"on":""}">Entrega</button><button type="button" data-a="mode" data-v="retirada" class="${ck.mode==="retirada"?"on":""}">Retirada</button></div></div>
  ${ck.mode==="entrega"?`<div class="grp"><label for="ck-bairro">Região de entrega</label><select id="ck-bairro">${FEES.map((f,i)=>`<option value="${i}"${i===ck.bairro?" selected":""}>${f[0]} (${BRL(f[1])})</option>`).join("")}</select></div>
  <div class="addr">${fld("ck-rua","Rua",ck.rua,'autocomplete="address-line1" placeholder="Nome da rua ou avenida"')}
  ${fld("ck-num","Número",ck.num,'inputmode="numeric" placeholder="Nº"')}</div>
  ${fld("ck-bai","Bairro",ck.bai,'placeholder="Seu bairro"')}
  ${fld("ck-comp","Complemento ou referência (opcional)",ck.comp,'placeholder="Ex: casa de muro azul, apto 2"')}`:""}
  <div class="grp"><span class="lbl">Pagamento</span><div class="seg">${["Pix","Cartão","Dinheiro"].map(p=>`<button type="button" data-a="pay" data-v="${p}" class="${ck.pay===p?"on":""}">${p}</button>`).join("")}</div></div>
  ${ck.pay==="Dinheiro"?`<div class="grp"><label for="ck-troco">Troco para quanto?</label><input id="ck-troco" value="${esc(ck.troco)}" inputmode="decimal" placeholder="Ex: 100"></div>`:""}
  <div class="tot"><div><span>Subtotal</span><span>${BRL(s)}</span></div>${ck.mode==="entrega"?`<div><span>Entrega</span><span>${BRL(fee)}</span></div>`:""}<div class="big"><span>Total</span><span>${BRL(s+fee)}</span></div></div>
  ${err?`<p class="err">${err}</p>`:""}
  <button class="primary" type="button" data-a="send"><span>Enviar pedido</span><span>${BRL(s+fee)}</span></button>`);
  const sh=$(".sheet");
  const g=id=>$("#"+id)?$("#"+id).value:null;
  const save=()=>{ck.name=g("ck-name");ck.phone=g("ck-phone");ck.cpf=g("ck-cpf");if($("#ck-bairro"))ck.bairro=+g("ck-bairro");
    for(const [k,id] of [["rua","ck-rua"],["num","ck-num"],["bai","ck-bai"],["comp","ck-comp"],["troco","ck-troco"]])if($("#"+id))ck[k]=g(id)};
  sh.addEventListener("input",e=>{const t=e.target;if(t.id==="ck-cpf")t.value=maskCpf(t.value);if(t.id==="ck-phone")t.value=maskTel(t.value);if(t.classList.contains("bad")){t.classList.remove("bad");t.removeAttribute("aria-invalid")}});
  sh.addEventListener("change",e=>{if(e.target.id==="ck-bairro"){save();const k=sh.scrollTop;checkout();$(".sheet").scrollTop=k}});
  sh.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;save();const a=b.dataset.a,k=sh.scrollTop;if(a!=="send")badF=[];
    if(a==="x")return close();
    if(a==="rm"){cart.splice(+b.dataset.i,1);updBar();if(!cart.length)return close()}
    if(a==="mode")ck.mode=b.dataset.v; if(a==="pay")ck.pay=b.dataset.v;
    if(a==="send"){const ent=ck.mode==="entrega", tel=digits(ck.phone).length;
      const chk=[["ck-name",!ck.name.trim(),"seu nome"],["ck-phone",tel<10||tel>11,"um WhatsApp com DDD"],["ck-cpf",!cpfOk(ck.cpf),"um CPF válido"],
        ["ck-rua",ent&&!ck.rua.trim(),"a rua"],["ck-num",ent&&!ck.num.trim(),"o número"],["ck-bai",ent&&!ck.bai.trim(),"o bairro"]].filter(x=>x[1]);
      badF=chk.map(x=>x[0]);
      if(chk.length){const n=chk.map(x=>x[2]);checkout("Falta preencher "+(n.length>1?n.slice(0,-1).join(", ")+" e "+n.at(-1):n[0])+".");const f=$("#"+badF[0]);if(f){f.focus();f.scrollIntoView({block:"center"})}return}
      return done(fee)}
    checkout();$(".sheet").scrollTop=k};
}
function done(fee){
  const now=new Date(), hh=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}), s=sub(), no=orderNo++;
  const ticket=`<div class="ticket" aria-label="Prévia da comanda da cozinha">
   <div class="c lg">FANTASMINHA LANCHES</div><div class="c sm">${now.toLocaleDateString("pt-BR")} ${hh}</div><hr>
   <div class="c xl">PEDIDO #${no}</div><div class="c lg">${ck.mode==="entrega"?"ENTREGA":"RETIRADA"}</div><hr>
   ${cart.map(l=>`<div class="it"><div class="lg">${l.qty}x ${esc(l.nm.toUpperCase())}</div>${l.size?`<div>TAM: ${({P:"PEQUENO",M:"MÉDIO",G:"GRANDE"})[l.size]}</div>`:""}${l.choice?`<div>&gt; ${esc(l.choice.toUpperCase())}</div>`:""}${l.adds.map(a=>`<div>+ ${a.q}x ${esc(a.nm.toUpperCase())}</div>`).join("")}${l.obs?`<div class="ob">OBS: ${esc(l.obs.toUpperCase())}</div>`:""}</div>`).join("")}
   <hr><div>${esc(ck.name)}${ck.phone?` · ${esc(ck.phone)}`:""}</div>${ck.mode==="entrega"?`<div class="lg">${esc(ck.rua)}, ${esc(ck.num)}</div><div>${esc(ck.bai)} · ${FEES[ck.bairro][0]}</div>${ck.comp?`<div>${esc(ck.comp)}</div>`:""}`:""}<hr>
   <div class="rw"><span>Subtotal</span><span>${BRL(s)}</span></div>${fee?`<div class="rw"><span>Entrega</span><span>${BRL(fee)}</span></div>`:""}<div class="rw lg"><span>TOTAL</span><span>${BRL(s+fee)}</span></div>
   <div>Pgto: ${ck.pay.toUpperCase()}${ck.pay==="Dinheiro"&&ck.troco?` · troco p/ R$ ${esc(ck.troco)}`:""}</div></div>`;
  open(`<div class="sh-head"><div></div><button class="x" type="button" data-a="x" aria-label="Fechar">×</button></div>
  <div class="done">${$(".logo")?`<img class="done-logo" src="${$(".logo").src}" alt="" width="170" height="133">`:""}<h3>Pedido #${no} enviado</h3><p>No sistema real, a cozinha ouve um alerta e esta comanda sai sozinha na impressora térmica, sem ninguém apertar nada.</p>
  <span class="ticketcap">Prévia da comanda · bobina 58mm</span>${ticket}
  <button class="primary" type="button" data-a="new" style="width:100%"><span>Fazer outro pedido</span><span>→</span></button></div>`);
  $(".sheet").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;close();if(b.dataset.a==="new"){cart=[];updBar();window.scrollTo(0,0)}};
}

async function loadMenu(){
  $("#menu").innerHTML='<div class="state">Carregando cardápio…</div>';
  try{
    const [c,i,a,f]=await Promise.all([
      sb.from("categories").select("*").order("sort"),
      sb.from("items").select("*").order("sort"),
      sb.from("addons").select("*").eq("available",true).order("sort"),
      sb.from("delivery_fees").select("*").order("sort")]);
    const err=c.error||i.error||a.error||f.error; if(err) throw err;
    ADD=a.data.map(x=>[x.name,+x.price]);
    FEES=f.data.map(x=>[x.name,+x.fee]);
    CATS=c.data.map(cat=>({id:cat.id,nm:cat.name,sub:cat.subtitle||"",add:cat.allows_addons,
      items:i.data.filter(x=>x.category_id===cat.id).map(x=>[x.number??"",x.name,x.description||"",+x.price,
        x.sizes&&x.sizes.length?x.sizes.map(z=>[z.label,+z.price]):null,x.options&&x.options.length?x.options:null,x.photo_url,x.available])}))
      .filter(cat=>cat.items.length);
    renderMenu(); watchTabs();
  }catch(e){
    console.error(e);
    $("#menu").innerHTML='<div class="state"><p>Não foi possível carregar o cardápio. Confira sua internet e tente de novo.</p><button type="button" onclick="loadMenu()">Tentar de novo</button></div>';
  }
}
document.querySelector(".logo")?.addEventListener("click",e=>{const l=e.currentTarget;l.classList.remove("spin");void l.offsetWidth;l.classList.add("spin");setTimeout(()=>l.classList.remove("spin"),900)});
(function(){const b=$("#buddy"),lg=$(".logo");if(!b||!lg)return;b.querySelector("img").src=lg.src;
  let last=scrollY,t;const upd=()=>{const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    b.style.setProperty("--p",p.toFixed(3));b.classList.toggle("show",scrollY>260);
    const d=scrollY-last;if(Math.abs(d)>2){b.classList.toggle("down",d>0);b.classList.toggle("up",d<0);clearTimeout(t);t=setTimeout(()=>b.classList.remove("down","up"),350)}last=scrollY};
  addEventListener("scroll",upd,{passive:true});addEventListener("resize",upd);upd();
  window.buddyHop=()=>{b.classList.remove("hop");void b.offsetWidth;b.classList.add("hop");setTimeout(()=>b.classList.remove("hop"),700)};})();
loadMenu();
</script>
